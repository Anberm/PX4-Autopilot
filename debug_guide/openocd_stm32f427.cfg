# OpenOCD configuration for STM32F427 with ST-Link/V2
# 适用于 Kite F427 飞控板调试

# 接口配置
# 支持 ST-Link/V2 和 ST-Link/V2-1
source [find interface/stlink.cfg]

# 目标器件配置
# STM32F4系列（F427和其他F4MCU）
source [find target/stm32f4x.cfg]

# 调试适配器配置
# 设置TCK频率为1MHz（调试速度，可根据需要调整）
# 较低频率更稳定，较高频率更快
# 注意：新版本OpenOCD (0.12.0+) 使用 'adapter speed' 替代 'adapter_khz'
adapter speed 1000
# 兼容旧版本OpenOCD，可取消注释以下行
# adapter_khz 1000

# 初始化目标
init

# 连接方式：SWD（推荐，仅需4条线）
# JTAG也支持，但需要更多引脚
# transport select swd  # 如果需要显式指定

# 可选：复位事件处理
# 复位后自动执行的命令
$_TARGETNAME configure -event reset-init {
    echo "STM32F427 reset and init complete"
}

# 可选：Flash编程参数
# 设置Flash程序算法
# stm32f4x flash_bank <name> stm32f2x <base> <size> <width> <wsect> <target#>

# 可选：启用内存映射Flash
# flash bank $_FLASHNAME stm32f2x 0 0 0 0 $_TARGETNAME

# 脚本级调试输出（取消注释以启用详细日志）
# debug_level 3
# set_log_output openocd_debug.log

# 连接超时配置
# adapter driver hla_swd

# 调试会话的默认行为
# 不需要特殊配置，GDB会通过远程协议控制

# 注意事项：
# 1. ST-Link必须在启动OpenOCD之前连接
# 2. SWD接线：
#    ST-Link Pin1 (VDD)  -> 3.3V
#    ST-Link Pin2 (SWDIO)-> PA13
#    ST-Link Pin4 (SWCLK)-> PA14
#    ST-Link Pin3/5(GND) -> GND
# 3. 如果遇到ID CODE错误，检查接线和电源
# 4. 默认OpenOCD监听 localhost:3333 供GDB连接
